<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quản Lý Nội Dung YouTube</title>
<meta name="description" content="Ứng dụng quản lý nội dung YouTube cho kênh faceless tiếng Việt">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1117; --bg-elev:#161922; --bg-elev2:#1e222c; --bg-elev3:#262b37;
  --text:#e7e9ee; --text-dim:#9aa1b1; --border:#2a2f3a;
  --accent:#6c5ce7; --accent-text:#ffffff;
  --success:#2ecc71; --danger:#e74c3c; --warning:#f39c12; --info:#3498db;
  --radius:10px; --radius-sm:6px;
  --shadow:0 4px 16px rgba(0,0,0,.35);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f5f6fa; --bg-elev:#ffffff; --bg-elev2:#eef0f5; --bg-elev3:#e3e6ee;
  --text:#1b1e27; --text-dim:#626878; --border:#dfe2ea;
  --shadow:0 4px 16px rgba(0,0,0,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14px; line-height:1.5; -webkit-tap-highlight-color:transparent;
}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--bg-elev2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.hidden{display:none !important;}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elev3);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;}
.btn:hover{filter:brightness(1.1);}
.btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-success{background:var(--success);color:#08321a;border-color:var(--success);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{padding:8px;width:36px;height:36px;justify-content:center;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--bg-elev2);}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
@media(max-width:520px){.grid-4{grid-template-columns:1fr;}}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg-elev3);color:var(--text-dim);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bg-elev3);}
.chip button{background:none;border:none;color:var(--text-dim);font-size:14px;line-height:1;padding:0;}
.section-title{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.text-dim{color:var(--text-dim);}
.progress{height:8px;border-radius:6px;background:var(--bg-elev3);overflow:hidden;}
.progress > div{height:100%;border-radius:6px;transition:width .3s;}
.overdue{color:var(--danger) !important;font-weight:700;}
label.field{display:block;margin-bottom:12px;}
label.field > span{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
label.field input,label.field select,label.field textarea{width:100%;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.row-between{display:flex;gap:10px;align-items:center;justify-content:space-between;}
.stack{display:flex;flex-direction:column;gap:8px;}

/* App shell */
#app{display:flex;min-height:100vh;}
#sidenav{width:220px;flex:none;background:var(--bg-elev);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;}
#sidenav .brand{font-weight:800;font-size:16px;padding:6px 10px 18px;display:flex;align-items:center;gap:8px;}
#sidenav .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-dim);font-weight:600;font-size:13.5px;text-align:left;background:none;border:none;width:100%;margin-bottom:2px;}
#sidenav .nav-btn:hover{background:var(--bg-elev2);color:var(--text);}
#sidenav .nav-btn.active{background:var(--accent);color:#fff;}
#sidenav .nav-btn .ic{font-size:16px;width:20px;text-align:center;}
#main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;}
#topbar .spacer{flex:1;}
#hamburger{display:none;}
#main{padding:20px;flex:1;max-width:1400px;width:100%;margin:0 auto;}
#bottomnav{display:none;}
.view h1.page-title{font-size:20px;margin:0 0 16px;}

@media(max-width:900px){
  #sidenav{display:none;}
  #hamburger{display:inline-flex;}
  #main{padding:14px;padding-bottom:80px;}
  #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg-elev);border-top:1px solid var(--border);z-index:30;padding:4px 2px;}
  #bottomnav button{flex:1;background:none;border:none;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 2px;font-weight:600;}
  #bottomnav button.active{color:var(--accent);}
  #bottomnav .ic{font-size:18px;}
}
#sidenav.mobile-open{display:flex;position:fixed;left:0;top:0;bottom:0;z-index:50;box-shadow:var(--shadow);}
#nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;}
#nav-overlay.show{display:block;}

/* Dashboard */
.stat-card{display:flex;flex-direction:column;gap:4px;}
.stat-card .num{font-size:26px;font-weight:800;}
.stat-card .lbl{color:var(--text-dim);font-size:12.5px;}
.status-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.status-table th,.status-table td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);}
.status-table th{color:var(--text-dim);font-weight:600;}
.status-table td:first-child,.status-table th:first-child{text-align:left;}
.ch-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;}
.deadline-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.deadline-item:last-child{border-bottom:none;}
.channel-goal-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.channel-goal-row .name{width:130px;flex:none;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.channel-goal-row .bars{flex:1;display:flex;flex-direction:column;gap:4px;}
.channel-goal-row .bars .lbl{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;}

/* Ideas */
.idea-card{border-left:4px solid var(--accent);}
.idea-card .scores{display:flex;gap:12px;font-size:11.5px;color:var(--text-dim);margin-top:6px;}
.idea-card .scores b{color:var(--text);}
#ideas-list{display:flex;flex-direction:column;gap:10px;}

/* Kanban */
#kanban-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;}
.kanban-col{flex:none;width:250px;background:var(--bg-elev2);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 220px);}
.kanban-col-head{padding:10px 12px;font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-elev2);border-radius:var(--radius) var(--radius) 0 0;}
.kanban-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:60px;}
.kanban-card{background:var(--bg-elev);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius-sm);padding:10px;cursor:grab;font-size:12.5px;}
.kanban-card:hover{box-shadow:var(--shadow);}
.kanban-card .t{font-weight:700;font-size:13px;margin-bottom:6px;word-break:break-word;}
.kanban-card .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.sortable-ghost{opacity:.4;}
.sortable-drag{cursor:grabbing;}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-daylbl{text-align:center;font-size:11px;color:var(--text-dim);font-weight:700;padding:4px 0;}
.cal-day{background:var(--bg-elev2);border-radius:var(--radius-sm);min-height:90px;padding:6px;font-size:11px;position:relative;border:1px solid var(--border);}
.cal-day.other-month{opacity:.35;}
.cal-day.today{border-color:var(--accent);border-width:2px;}
.cal-day .daynum{font-weight:700;margin-bottom:4px;font-size:12px;}
.cal-item{border-radius:4px;padding:2px 5px;margin-bottom:3px;font-size:10.5px;color:#fff;cursor:grab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-week .cal-day{min-height:220px;}
@media(max-width:700px){.cal-grid{grid-template-columns:repeat(7,minmax(70px,1fr));overflow-x:auto;}.cal-day{min-height:70px;}}

/* Trash */
.trash-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--bg-elev);border-radius:var(--radius);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal-box.wide{max-width:900px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-elev);z-index:5;}
.modal-head h2,.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--bg-elev);}

/* Video detail */
#video-modal .modal-box{max-width:960px;width:96vw;}
.vd-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-elev);z-index:6;}
.vd-head input.title-input{flex:1;min-width:150px;font-size:16px;font-weight:700;background:transparent;border:1px solid transparent;padding:6px 8px;}
.vd-head input.title-input:hover,.vd-head input.title-input:focus{border-color:var(--border);background:var(--bg-elev2);}
.vd-tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--border);background:var(--bg-elev2);position:sticky;top:64px;z-index:5;}
.vd-tabs button{background:none;border:none;padding:12px 12px;font-size:12px;font-weight:700;color:var(--text-dim);white-space:nowrap;border-bottom:3px solid transparent;}
.vd-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
.vd-tabbody{padding:18px 20px;min-height:300px;}
.list-editable{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.list-editable .row-item{display:flex;gap:6px;align-items:flex-start;background:var(--bg-elev2);padding:8px;border-radius:var(--radius-sm);}
.list-editable .row-item input,.list-editable .row-item textarea{flex:1;}
.check-item{display:flex;align-items:center;gap:8px;background:var(--bg-elev2);padding:8px 10px;border-radius:var(--radius-sm);}
.check-item.done .txt{text-decoration:line-through;color:var(--text-dim);}
.check-item .txt{flex:1;border:none;background:transparent;padding:2px;}
.charcount{font-size:11px;color:var(--text-dim);}
.charcount.over{color:var(--danger);font-weight:700;}
#teleprompter{position:fixed;inset:0;background:#000;color:#fff;z-index:200;display:flex;flex-direction:column;}
#teleprompter .tp-controls{position:sticky;top:0;background:rgba(0,0,0,.85);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2;}
#teleprompter .tp-text{flex:1;overflow-y:auto;padding:60px 8vw 60vh;font-size:32px;line-height:1.7;white-space:pre-wrap;}
#teleprompter .tp-text.mirror{transform:scaleX(-1);}

/* Toast */
#toast-container{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
@media(max-width:900px){#toast-container{bottom:70px;left:14px;right:14px;}}
.toast{background:var(--bg-elev3);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13px;display:flex;align-items:center;gap:10px;animation:toastin .2s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.toast button{background:none;border:none;color:var(--accent);font-weight:700;font-size:12px;}

.settings-block{margin-bottom:26px;}
.channel-edit-row{display:grid;grid-template-columns:auto 1fr 1fr auto auto auto;gap:8px;align-items:center;margin-bottom:8px;}
@media(max-width:700px){.channel-edit-row{grid-template-columns:1fr 1fr;}}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:6px;background:var(--bg-elev2);border:1px solid var(--border);border-radius:var(--radius-sm);}
.tag-input-wrap input{border:none;background:none;flex:1;min-width:80px;padding:3px;}
.banner{background:var(--warning);color:#221900;padding:10px 16px;border-radius:var(--radius-sm);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:600;flex-wrap:wrap;}
.kbd{background:var(--bg-elev3);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:monospace;font-size:12px;}
table.simple{width:100%;border-collapse:collapse;font-size:13px;}
table.simple th,table.simple td{padding:8px;border-bottom:1px solid var(--border);text-align:left;}
.empty-hint{color:var(--text-dim);text-align:center;padding:30px 10px;font-size:13px;}
</style>
</head>
<body>
<div id="app">
  <div id="nav-overlay"></div>
  <nav id="sidenav">
    <div class="brand">📺 Quản Lý YouTube</div>
    <button class="nav-btn" data-view="dashboard"><span class="ic">🏠</span>Tổng quan</button>
    <button class="nav-btn" data-view="ideas"><span class="ic">💡</span>Kho ý tưởng</button>
    <button class="nav-btn" data-view="kanban"><span class="ic">🗂️</span>Bảng Kanban</button>
    <button class="nav-btn" data-view="calendar"><span class="ic">📅</span>Lịch</button>
    <button class="nav-btn" data-view="stats"><span class="ic">📊</span>Thống kê</button>
    <button class="nav-btn" data-view="trash"><span class="ic">🗑️</span>Thùng rác</button>
    <button class="nav-btn" data-view="settings"><span class="ic">⚙️</span>Cài đặt</button>
    <div class="spacer" style="flex:1"></div>
    <button class="nav-btn" id="btn-shortcuts"><span class="ic">⌨️</span>Phím tắt</button>
  </nav>
  <div id="main-wrap">
    <header id="topbar">
      <button class="btn btn-icon btn-ghost" id="hamburger">☰</button>
      <div class="spacer"></div>
      <button class="btn btn-icon btn-ghost" id="btn-undo" title="Hoàn tác (Ctrl+Z)" disabled>↩️</button>
      <button class="btn btn-icon btn-ghost" id="btn-theme" title="Chuyển sáng/tối">🌙</button>
      <button class="btn btn-primary" id="btn-quick-add" title="Thêm nhanh (N)">＋ Thêm</button>
    </header>
    <main id="main">
      <section id="view-dashboard" class="view"></section>
      <section id="view-ideas" class="view hidden"></section>
      <section id="view-kanban" class="view hidden"></section>
      <section id="view-calendar" class="view hidden"></section>
      <section id="view-stats" class="view hidden"></section>
      <section id="view-trash" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>
  </div>
  <nav id="bottomnav">
    <button data-view="dashboard"><span class="ic">🏠</span>Tổng quan</button>
    <button data-view="ideas"><span class="ic">💡</span>Ý tưởng</button>
    <button data-view="kanban"><span class="ic">🗂️</span>Kanban</button>
    <button data-view="calendar"><span class="ic">📅</span>Lịch</button>
    <button data-view="stats"><span class="ic">📊</span>Thống kê</button>
    <button data-view="settings"><span class="ic">⚙️</span>Cài đặt</button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast-container"></div>
<script src="app.js"></script>
</body>
</html>
